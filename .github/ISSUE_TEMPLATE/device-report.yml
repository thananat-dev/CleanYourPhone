name: Device report / รายงานเครื่อง
description: แจ้งผลการใช้งานบนเครื่องของคุณ เพื่อช่วยยืนยันรายการแพ็กเกจ
labels: ["device-report"]
body:
  - type: input
    id: model
    attributes:
      label: ยี่ห้อและรุ่น
      placeholder: Redmi Note 13 Pro
    validations:
      required: true
  - type: input
    id: rom
    attributes:
      label: ROM / เวอร์ชัน
      placeholder: HyperOS 2.0.5, Android 15
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: ผลจาก `python cyp.py info` และ `python cyp.py scan`
      render: text
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: ปิดถึงระดับไหน
      options: [safe, recommended, advanced]
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: ผลลัพธ์
      description: โฆษณาหายไหม มีอะไรใช้ไม่ได้หรือเปล่า แพ็กเกจที่ควรเพิ่มหรือย้ายระดับ
    validations:
      required: true
